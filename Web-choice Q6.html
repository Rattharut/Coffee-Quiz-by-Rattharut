<body class="container">

<div class="Main">

  <a class="button" href="Web-choice Q7.html">Next</a>

<p class="Nub">6 of 10 questions</p>

</div>

<script>
  document.querySelectorAll('input[name="ตัวเลือก"]').forEach(input => {
    input.addEventListener('change', function() {

      if (this.classList.contains('correct')) {
        this.classList.add('is-correct');
        
        let currentScore = parseInt(localStorage.getItem('quizScore')) || 0;
        localStorage.setItem('quizScore', currentScore + 1);
      } else {
        this.classList.add('is-wrong');
        document.querySelector('.correct').classList.add('is-correct');
      }

      document.querySelectorAll('input[name="ตัวเลือก"]').forEach(el => el.disabled = true);
    });
  });
</script>

<script>
 
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  function centerView() {
    const middleY = document.documentElement.scrollHeight / 2 - window.innerHeight / 2;
    window.scrollTo({ top: Math.max(0, middleY), behavior: 'auto' });
  }

  window.addEventListener('DOMContentLoaded', centerView);
  window.addEventListener('load', centerView);  
</script>

</body>
</html>
